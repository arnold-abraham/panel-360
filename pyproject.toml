[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel360"
version = "0.1.0"
description = "Thermal panel autoencoder, LSTM forecasting, and anomaly detection pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow==2.15.1",
    "numpy<2",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
influx = [
    "influxdb-client>=1.40",
]

[project.scripts]
panel360-train = "panel360.pipelines.train_autoencoder:main"
panel360-forecast = "panel360.pipelines.forecast:main"
panel360-evaluate = "panel360.pipelines.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
